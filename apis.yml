name: Astro Sea
description: >-
  Astro (PT Astro Technologies Indonesia), operating at astronauts.id, is an
  Indonesian quick-commerce platform that delivers groceries and everyday
  essentials in as little as 15 minutes. Its consumer mobile apps (iOS and
  Android) offer more than 3,000 curated products spanning fresh produce,
  frozen goods, groceries, beauty, household items, and electronics, with 24/7
  service across the Greater Jakarta (JADETABEK) region. Astro is backed by
  Lightspeed Venture Partners and was surfaced through that portfolio into the
  API Evangelist network. Astro is a business-to-consumer application company;
  it publishes a consumer app, a corporate site, and an RFC 9116 security
  contact, but does not currently expose a public developer API, OpenAPI
  definition, SDKs, or developer portal.
